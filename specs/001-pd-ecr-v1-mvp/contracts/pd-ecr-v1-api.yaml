openapi: 3.0.3
info:
  title: PD-ECR V1 MVP API
  version: 1.0.0
  description: Stable V1 API contract for historical case browsing, retrieval, AI draft generation, module display, and basic export.
servers:
  - url: /api/v1/pd-ecr
paths:
  /cases:
    get:
      summary: List historical PD-ECR cases
      responses:
        "200":
          description: Historical case list
          content:
            application/json:
              schema:
                type: object
                required: [cases]
                properties:
                  cases:
                    type: array
                    items:
                      $ref: "#/components/schemas/HistoricalCaseListItem"
  /cases/{case_id}:
    get:
      summary: Get historical PD-ECR case detail
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Historical case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalCaseDetail"
        "404":
          description: Case not found
  /requests:
    post:
      summary: Validate and create a new PD-ECR input snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPdEcrRequest"
      responses:
        "200":
          description: Validated request snapshot
          content:
            application/json:
              schema:
                type: object
                required: [request_id, input]
                properties:
                  request_id:
                    type: string
                  input:
                    $ref: "#/components/schemas/NewPdEcrRequest"
                  missing_fields:
                    type: array
                    items:
                      type: string
  /retrieve:
    post:
      summary: Retrieve Top K similar historical cases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrieveRequest"
      responses:
        "200":
          description: Ranked similar cases
          content:
            application/json:
              schema:
                type: object
                required: [query_input, top_k, results]
                properties:
                  query_input:
                    $ref: "#/components/schemas/NewPdEcrRequest"
                  top_k:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SimilarCaseResult"
  /generate-draft:
    post:
      summary: Generate structured six-module PD-ECR draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input:
                  $ref: "#/components/schemas/NewPdEcrRequest"
                similar_cases:
                  type: array
                  items:
                    $ref: "#/components/schemas/SimilarCaseResult"
      responses:
        "200":
          description: Generated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedDraft"
  /drafts/{draft_id}/modules:
    get:
      summary: Get generated modules for a draft
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Generated modules
          content:
            application/json:
              schema:
                type: object
                required: [draft_id, modules]
                properties:
                  draft_id:
                    type: string
                  draft_status:
                    type: string
                    enum: [V1_MVP_DRAFT]
                  modules:
                    type: array
                    items:
                      $ref: "#/components/schemas/GeneratedModule"
  /export:
    post:
      summary: Export a basic PD-ECR report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draft_id, format]
              properties:
                draft_id:
                  type: string
                format:
                  type: string
                  enum: [html, csv]
                draft:
                  $ref: "#/components/schemas/GeneratedDraft"
      responses:
        "200":
          description: Export result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResult"
components:
  schemas:
    HistoricalMetadata:
      type: object
      required: [case_id, dc_no, mcr_no, change_type, product_no, part_no, customer_project, source_file]
      properties:
        case_id:
          type: string
        dc_no:
          type: string
        mcr_no:
          type: string
        change_type:
          type: string
        product_no:
          type: string
        part_no:
          type: string
        customer_project:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        source_file:
          type: string
        date:
          type: string
        initiator:
          type: string
    HistoricalCaseListItem:
      type: object
      required: [case_id, metadata, source_file, missing_fields]
      properties:
        case_id:
          type: string
        metadata:
          $ref: "#/components/schemas/HistoricalMetadata"
        source_file:
          type: string
        missing_fields:
          type: array
          items:
            type: string
        module_summary:
          type: string
    HistoricalCaseDetail:
      type: object
      required: [case_id, metadata, modules, source_file, missing_fields]
      properties:
        case_id:
          type: string
        metadata:
          $ref: "#/components/schemas/HistoricalMetadata"
        modules:
          type: array
          items:
            $ref: "#/components/schemas/HistoricalModule"
        source_file:
          type: string
        source_trace:
          type: object
          additionalProperties: true
        missing_fields:
          type: array
          items:
            type: string
    HistoricalModule:
      type: object
      required: [module_id, title, summary, content, source_file]
      properties:
        module_id:
          $ref: "#/components/schemas/ModuleId"
        title:
          type: string
        summary:
          type: string
        content:
          type: string
        source_file:
          type: string
    NewPdEcrRequest:
      type: object
      required: [dc_no, mcr_no, customer_project, product_no, part_no, change_type, change_description, change_reason]
      properties:
        dc_no:
          type: string
        mcr_no:
          type: string
        customer_project:
          type: string
        product_no:
          type: string
        part_no:
          type: string
        change_type:
          type: string
        change_description:
          type: string
        change_reason:
          type: string
        date:
          type: string
        initiator:
          type: string
        current_design:
          type: string
        change_proposal:
          type: string
        remarks:
          type: string
        top_k:
          type: integer
          default: 5
          minimum: 1
          maximum: 20
    RetrieveRequest:
      type: object
      required: [input]
      properties:
        input:
          $ref: "#/components/schemas/NewPdEcrRequest"
        top_k:
          type: integer
          default: 5
          minimum: 1
          maximum: 20
        filters:
          type: object
          properties:
            customer_project:
              type: string
            product_no:
              type: string
            part_no:
              type: string
            change_type:
              type: string
    SimilarCaseResult:
      type: object
      required: [rank, case_id, dc_no, change_type, matched_fields, similarity_score, source_file, module_summary, source_cases, source_files]
      properties:
        rank:
          type: integer
        case_id:
          type: string
        dc_no:
          type: string
        change_type:
          type: string
        matched_fields:
          type: array
          items:
            type: string
        similarity_score:
          type: number
        similarity_reason:
          type: string
        source_file:
          type: string
        module_summary:
          type: string
        source_cases:
          type: array
          items:
            type: string
        source_files:
          type: array
          items:
            type: string
        retrieval_mode:
          type: string
    GeneratedDraft:
      type: object
      required: [draft_id, draft_status, input_snapshot, similar_cases, modules, generated_at]
      properties:
        draft_id:
          type: string
        draft_status:
          type: string
          enum: [V1_MVP_DRAFT]
        input_snapshot:
          $ref: "#/components/schemas/NewPdEcrRequest"
        similar_cases:
          type: array
          items:
            $ref: "#/components/schemas/SimilarCaseResult"
        modules:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/GeneratedModule"
        report_url:
          type: string
        generated_at:
          type: string
    GeneratedModule:
      type: object
      required: [module_id, title, summary, content, source_cases, source_files, needs_human_input, warnings]
      properties:
        module_id:
          $ref: "#/components/schemas/ModuleId"
        title:
          type: string
        summary:
          type: string
        content:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        source_cases:
          type: array
          items:
            type: string
        source_files:
          type: array
          items:
            type: string
        needs_human_input:
          type: boolean
        warnings:
          type: array
          items:
            type: string
    ExportResult:
      type: object
      required: [export_id, draft_id, format, draft_status, source_files, created_at]
      properties:
        export_id:
          type: string
        draft_id:
          type: string
        format:
          type: string
          enum: [html, csv]
        draft_status:
          type: string
          enum: [V1_MVP_DRAFT]
        download_url:
          type: string
        source_files:
          type: array
          items:
            type: string
        created_at:
          type: string
    ModuleId:
      type: string
      enum:
        - basic_information
        - change_description
        - reason_for_change
        - impact_analysis
        - implementation_plan
        - approval_signoff_information
